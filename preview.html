<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Language Miner v6.4.100 Preview</title>
  <style>
    html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#07111f}
    #previewBadge{position:fixed;z-index:999999;right:16px;top:12px;padding:8px 13px;border:1px solid #78ffe0;border-radius:999px;background:#082b2be8;color:#eafff8;font:700 13px/1 system-ui;box-shadow:0 6px 22px #0008;pointer-events:none}
  </style>
</head>
<body>
  <div id="previewBadge">PREVIEW · v6.4.100</div>
  <iframe id="gamePreview" src="index.html?v=6.4.100-voice-and-style-controls" title="Language Miner updated preview"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('gamePreview');
      frame.addEventListener('load', () => {
        const app = frame.contentWindow;
        const previewParameters = new URLSearchParams(location.search);
        const previewAdmin = previewParameters.get('admin') !== '0';
        const previewView = previewParameters.get('view') || 'admin';
        const previewAutoConfirm = previewParameters.get('autoconfirm') === '1';
        const profile = previewAdmin
          ? {id:'codex-preview',name:'Erendragneel',cloudUserId:'preview-admin',email:'preview-admin@local.test'}
          : {id:'codex-preview-player',name:'Preview Miner',cloudUserId:null,email:null};
        try {
          app.LANGUAGE_MINER_PREVIEW = true;
          document.getElementById('previewBadge').textContent = `PREVIEW · v6.4.100 · ${previewAdmin?'ADMIN':'PLAYER'}`;
          if (previewAutoConfirm) app.confirm = () => true;
          app.renderProfileList ||= () => {};
          const demoProfiles = [
            profile,
            {id:'preview-player-mina',name:'Mina Preview',email:'mina.preview@example.test',cloudUserId:'preview-cloud-mina',createdAt:Date.now()-86400000*12,lastPlayed:Date.now()-3600000},
            {id:'preview-player-kai',name:'Kai Preview',createdAt:Date.now()-86400000*8,lastPlayed:Date.now()-7200000}
          ];
          let previewProfiles=[];try{previewProfiles=JSON.parse(app.localStorage.getItem('jm_profiles')||'[]')||[];}catch{}
          demoProfiles.forEach(item=>{const index=previewProfiles.findIndex(existing=>existing.id===item.id);if(index>=0)previewProfiles[index]={...previewProfiles[index],...item};else previewProfiles.push(item);});
          app.localStorage.setItem('jm_profiles',JSON.stringify(previewProfiles));
          app.localStorage.setItem('jm_profile_preview-player-mina',JSON.stringify({onboardingComplete:true,placementTestCompleted:true,placementUnlockedThrough:2,selectedStage:2,level:18,xp:240,hearts:5,maxHearts:5,hints:7,shields:3,stageXp:[18240,24000,16000,0,0,0,0],clearedStages:[0,1]}));
          app.localStorage.setItem('jm_profile_preview-player-kai',JSON.stringify({onboardingComplete:true,placementTestCompleted:true,placementUnlockedThrough:1,selectedStage:1,level:9,xp:90,hearts:3,maxHearts:4,hints:4,shields:2,stageXp:[18240,11000,0,0,0,0,0],clearedStages:[0]}));
          app.localStorage.setItem('lm_multilingual_functional_preview_v1:cloud:preview-cloud-mina',JSON.stringify({known:'en',learning:'es',placements:{es:{status:'tested',score:6,total:10}},guides:{es:true},progress:{es:{answered:42,correct:35,xp:310,mineXpByMine:{0:250,1:60},courseMastery:{},bossBestByMine:{0:100},bossDefeatedByMine:{0:true},reviewCheckpoints:{},selectedMine:1}}}));
          app.localStorage.setItem('lm_multilingual_functional_preview_v1:local:Kai Preview',JSON.stringify({known:'en',learning:'ja',placements:{ja:'beginner'},guides:{ja:true},progress:{}}));
          let existingPreviewState={};try{existingPreviewState=JSON.parse(app.localStorage.getItem(`jm_profile_${profile.id}`)||'{}')||{};}catch{}
          app.localStorage.setItem(`jm_profile_${profile.id}`, JSON.stringify({...existingPreviewState,
            onboardingComplete:true,
            placementTestCompleted:true,
            placementRewardClaimed:true,
            placementUnlockedThrough:0,
            selectedStage:0
          }));
          app.loadProfile?.(profile, previewAdmin);
          const alphabetMastery = Object.fromEntries('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(letter => [`alphabet:${letter}`, 20]));
          const previewCourseSettings = JSON.stringify({
              known:'en',
              learning:'ja',
              placements:{ja:'beginner'},
              guides:{ja:true},
              progress:{en:{answered:25,correct:25,xp:250,mineXpByMine:{0:250},courseMastery:alphabetMastery,bossBestByMine:{},bossDefeatedByMine:{},reviewCheckpoints:{},selectedMine:0}}
            });
          const cloudId = app.languageMinerCloudAuth?.getSession?.()?.user?.id;
          app.localStorage.setItem(`lm_multilingual_functional_preview_v1:${cloudId?`cloud:${cloudId}`:`local:${profile.name}`}`, previewCourseSettings);
          app.localStorage.setItem(`lm_multilingual_functional_preview_v1:local:${profile.name}`, previewCourseSettings);
          app.dispatchEvent(new app.CustomEvent('lm-cloud-session-changed'));
          if (previewView === 'map') app.setTimeout(() => app.openJapaneseMinerV5?.('map'), 1100);
          else if (previewView === 'admin' && previewAdmin) app.setTimeout(() => app.document.getElementById('developerBtn')?.click(), 1100);
        } catch (error) {
          console.error('Preview setup failed', error);
        }
      }, {once:true});
    })();
  </script>
</body>
</html>
